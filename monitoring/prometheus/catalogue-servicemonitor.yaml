apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: catalogue
  namespace: robot-shop
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - robot-shop
  selector:
    matchLabels:
      service: catalogue
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
